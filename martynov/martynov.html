<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Говорящий Мартынов</title>
<style>
:root { --bg:#16202e; --chalk:#eef1f5; --ink:#16202e; --accent:#3d6db5; --anger:#d9441f; --dim:#9aa7b8; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#fit{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;transition:transform .35s ease}
canvas{display:block;cursor:pointer;touch-action:none;border-radius:14px;box-shadow:0 10px 40px #0008}
#note{flex:none;min-height:3.8em;box-sizing:border-box;background:var(--chalk);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:17px;line-height:1.3;font-weight:600;display:flex;align-items:center}
#ask{flex:none;display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #3a4a60;background:#0f1722;color:var(--chalk)}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation}
button.ghost{background:none;border:1.5px solid #3a4a60;color:var(--chalk)}
button.on{background:var(--anger)}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#bar{flex:none;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
#meter{flex:1;height:6px;background:#2a3648;border-radius:3px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--anger)}
</style>
</head>
<body>
<main id="app">
  <div id="fit"><div id="stage"><canvas id="c" width="296" height="600" role="button" aria-label="Мартынов. Нажмите, чтобы он заговорил"></canvas></div></div>
  <div id="note" role="status" aria-live="polite">Мартынов задумался. Ткни его или задай вопрос.</div>
  <div id="ask">
    <button id="mic" type="button" aria-label="Спросить голосом">🎤</button>
    <input id="q" type="text" placeholder="Спроси: который час, анекдот, 12 умножить на 7…" enterkeyhint="send">
    <button id="send" type="button">→</button>
  </div>
  <div id="bar">
    <div id="meter" aria-hidden="true"><i id="fill"></i></div>
    <button id="voice" class="ghost" type="button">Его голос</button>
    <button id="mute" class="ghost" type="button">Звук: вкл</button>
  </div>
</main>

// Слои для «челюсти» и век с мягкими краями
function feather(w, h, cx, cy, rx, ry, cutTop) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.save(); x.translate(cx, cy); x.scale(rx, ry);
  const gr = x.createRadialGradient(0, 0, 0, 0, 0, 1);
  gr.addColorStop(0, '#000'); gr.addColorStop(.7, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore();
  if (cutTop !== undefined) x.clearRect(0, 0, w, cutTop);
  return c;
}
let jaw = null, lids = [];

  const j = jaw.getContext('2d');
  j.drawImage(m, 0, 0); j.globalCompositeOperation = 'source-in'; j.drawImage(front, 0, 0);

  lids = EYES.map(e => {

    return c;

}

async function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  an = ctx.createAnalyser(); an.fftSize = 512; data = new Float32Array(an.fftSize);
  an.connect(ctx.destination);
  try {
    const ab = await (await fetch(VOICE)).arrayBuffer();
    buf = await new Promise((ok, no) => { const p = ctx.decodeAudioData(ab, ok, no); if (p && p.then) p.then(ok, no); });
  } catch (e) { note.textContent = 'Не получилось открыть запись голоса.'; }
}
function stopClip() { if (src) { try { src.stop(); } catch {} src = null; } }
function playClip(a, b, text) {
  if (!buf || !soundOn) { if (text) note.textContent = text; return; }
  stopClip(); if (window.speechSynthesis) speechSynthesis.cancel();
  ctx.resume();
  src = ctx.createBufferSource(); src.buffer = buf; src.connect(an);
  src.start(0, a, b - a); clipEnd = performance.now() + (b - a) * 1000;
  src.onended = () => { src = null; };
  if (text) note.textContent = text;
  lastTalk = performance.now();
}
function level() {
  if (!src || !an) return 0;
  an.getFloatTimeDomainData(data);
  let s = 0; for (let i = 0; i < data.length; i++) s += data[i] * data[i];
  return Math.min(1, Math.sqrt(s / data.length) * 5);
}

// Синтез речи для ответов помощника
let voice = null, ttsUntil = 0, ttsOn = false;
const hasTTS = 'speechSynthesis' in window;
function findVoice() {
  const l = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang));
  voice = l.find(v => /dmitr|yuri|pavel|maxim|male|муж/i.test(v.name)) || l[0] || null;
}
if (hasTTS) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
function say(t) {
  note.textContent = t; lastTalk = performance.now();
  ttsUntil = performance.now() + 600 + t.length * 60;
  if (!soundOn || !hasTTS) return;
  stopClip(); speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'ru-RU'; if (voice) u.voice = voice;
  u.pitch = .75; u.rate = 1;
  u.onstart = () => { ttsOn = true; };
  u.onend = () => { ttsOn = false; ttsUntil = 0; };
  u.onerror = () => { ttsOn = false; };
  setTimeout(() => speechSynthesis.speak(u), 60);
}

// Помощник
const pick = a => a[Math.floor(Math.random() * a.length)];
const JOKES = [
  'Программист ставит на тумбочку два стакана. Один с водой, на случай если захочет пить. Второй пустой, на случай если не захочет.',
  'Купил рубашку в клетку. Теперь чувствую себя шахматной доской. Хожу конём.',
  'Говорят, утро вечера мудренее. Проверял. Утром я такой же.',
  'Жена спрашивает: ты меня слушаешь? Я говорю: конечно. А сам думаю, с чего это она начала разговор с вопроса.',
];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };
function answer(raw) {
  const q = raw.toLowerCase().replace(/ё/g, 'е');
  const num = q.replace(/,/g, '.').match(/(-?\d+(?:\.\d+)?)\s*(плюс|\+|минус|-|умножить на|умножь на|на|x|х|\*|×|разделить на|подели на|делить на|\/|:)\s*(-?\d+(?:\.\d+)?)/);
  if (num) {
    const a = +num[1], b = +num[3], op = num[2];
    let r = /плюс|\+/.test(op) ? a + b : /минус|-/.test(op) ? a - b : /раздел|подел|дел|\/|:/.test(op) ? (b === 0 ? null : a / b) : a * b;
    if (r === null) return 'На ноль делить не буду. Я не настолько смелый.';
    r = Math.round(r * 1000) / 1000;
    return `Будет ${String(r).replace('.', ',')}.`;
  }
  if (/врем|час(?!т)|сколько сейчас/.test(q)) {
    const d = new Date(), h = d.getHours(), m = d.getMinutes();
    return `Сейчас ${h} ${plural(h, 'час', 'часа', 'часов')} ${m} ${plural(m, 'минута', 'минуты', 'минут')}.`;
  }
  if (/числ|дата|какой (сегодня )?день|день недели/.test(q)) { const d = new Date(); return `Сегодня ${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}.`; }
  if (/привет|здравств|добр(ый|ое|ой)|хай|салют/.test(q)) return pick(['Здравствуй! Мартынов на связи.', 'Привет. Я тут, слушаю.', 'О, привет! Спрашивай.']);
  if (/как (у тебя )?дела|как ты|как жизнь/.test(q)) return pick(['Нормально. Рубашка чистая, настроение рабочее.', 'Живу в телефоне, не жалуюсь.', 'Отлично. Только спина немного видна, когда отворачиваюсь.']);
  if (/кто ты|как тебя зовут|твое имя|ты кто/.test(q)) return 'Я Мартынов. Говорящий. Голосовой помощник в клетчатой рубашке.';
  if (/анекдот|шутк|пошути|рассмеши/.test(q)) return pick(JOKES);
  if (/погод|дожд|холодно|тепло/.test(q)) return pick(['В окно посмотри. Я отсюда только экран вижу.', 'Погода хорошая, если рубашка тёплая.']);
  if (/спасиб|благодар/.test(q)) return pick(['Обращайся.', 'Всегда пожалуйста.', 'Не за что. Счёт пришлю потом.']);
  if (/пока|до свидан|спокойной ночи/.test(q)) return pick(['Пока! Я никуда не денусь.', 'До связи.']);
  if (/повернись|отвернись|спин/.test(q)) { turn(true, 3500); return 'Ну вот, смотри. Только без комментариев.'; }
  if (/своим голосом|твой голос|скажи что-нибудь|голос/.test(q)) { setTimeout(() => playRandom(), 50); return null; }
  if (/умеешь|что можешь|помощь|помоги/.test(q)) return 'Могу сказать время и дату, посчитать, рассказать анекдот и поговорить своим голосом. Ещё могу обидеться, если тыкать.';
  return pick(['Хороший вопрос. Подумаю и не отвечу.', 'Это я пока не умею. Спроси время или анекдот.', 'Не расслышал. Повтори попроще.', 'Хм. Давай лучше анекдот?']);
}
function handle(text) {
  text = (text || '').trim(); if (!text) return;
  start(); anger = Math.max(0, anger - 20);
  const a = answer(text);
  if (a) say(a);
}

// Состояние персонажа
let anger = 0, pokes = 0, turned = false, turnUntil = 0, lastTalk = 0, nextIdle = 0, blinkT = 0, nextBlink = 0, flip = 0;
let lastClip = -1;
function playRandom() {
  let i; do { i = Math.floor(Math.random() * CLIPS.length); } while (i === lastClip && CLIPS.length > 1);
  lastClip = i; playClip(CLIPS[i][0], CLIPS[i][1], '🔊 …');
}
function turn(on, ms) { turned = on; turnUntil = on ? performance.now() + ms : 0; }
async function start() {
  if (started) return; started = true;
  await initAudio();
  nextIdle = performance.now() + 30000;
}
async function poke(e) {
  e.preventDefault();
  const first = !started;
  await start(); ctx && ctx.resume();
  if (first) { playClip(CLIPS[0][0], CLIPS[0][1], 'Мартынов проснулся.'); return; }
  if (turned) { say(pick(['Не тычь в спину!', 'Я обиделся. Подожди.', 'Отстань, я отвернулся.'])); turnUntil += 1500; return; }
  pokes++; anger = Math.min(100, anger + 18);
  try { navigator.vibrate && navigator.vibrate(anger > 70 ? 50 : 12); } catch {}
  if (anger > 80) { say(pick(['Всё! Обиделся.', 'Хватит тыкать. Я отворачиваюсь.', 'Ну и ладно.'])); turn(true, 6000); anger = 40; return; }
  if (anger > 45) say(pick(['Эй, полегче.', 'Ты чего тычешь?', 'Я тебе не кнопка лифта.', 'Палец убери, пожалуйста.']));
  else playRandom();
}
cv.addEventListener('pointerdown', poke);

$('send').addEventListener('click', () => { handle($('q').value); $('q').value = ''; });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { handle($('q').value); $('q').value = ''; } });
$('voice').addEventListener('click', async () => { await start(); ctx.resume(); playClip(CLIPS[0][0], CLIPS[2][1], '🔊 Мартынов говорит.'); });
$('mute').addEventListener('click', () => {
  soundOn = !soundOn; $('mute').textContent = soundOn ? 'Звук: вкл' : 'Звук: выкл';
  if (!soundOn) { stopClip(); hasTTS && speechSynthesis.cancel(); }
});

// Распознавание речи
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$('mic').addEventListener('click', async () => {
  await start();
  if (!SR) { note.textContent = 'Этот браузер не умеет слушать. Напиши вопрос в поле.'; $('q').focus(); return; }
  if (listening) { rec.stop(); return; }
  stopClip(); hasTTS && speechSynthesis.cancel();
  rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = () => { listening = true; $('mic').classList.add('on'); note.textContent = 'Слушаю…'; };
  rec.onresult = e => {
    const r = e.results[e.results.length - 1], t = r[0].transcript;
    note.textContent = '«' + t + '»';
    if (r.isFinal) setTimeout(() => handle(t), 250);
  };
  rec.onerror = e => { note.textContent = e.error === 'not-allowed' ? 'Нет доступа к микрофону.' : 'Не расслышал. Попробуй ещё.'; };
  rec.onend = () => { listening = false; $('mic').classList.remove('on'); };
  try { rec.start(); } catch {}
});

// Рисование
function drawFace(now, open) {
  g.drawImage(front, 0, 0);
  // Моргание
  const b = blinkT > 0 ? Math.sin((1 - blinkT / 150) * Math.PI) : 0;
  if (b > .05) lids.forEach((l, i) => {
    const e = EYES[i], h = 34 * b;
    g.drawImage(l, 0, 0, 64, 34, e.x - 32, e.y - 22, 64, h + 6);
  });
  // Рот
  const h = open * 20;
  if (h > .6) {
    const { l, r, y } = MOUTH, w = (r - l) * (.85 + .15 * open), cx = MOUTH.x, x0 = cx - w / 2, x1 = cx + w / 2;
    g.fillStyle = '#2b0f0d';
    g.beginPath(); g.moveTo(x0, y); g.quadraticCurveTo(cx, y - 2, x1, y);
    g.quadraticCurveTo(cx, y + h * 2.1, x0, y); g.fill();
    if (h > 7) { g.fillStyle = 'rgba(205,192,176,.55)'; g.beginPath(); g.ellipse(cx, y + 1.5, w * .2, Math.min(2, h * .15), 0, 0, Math.PI * 2); g.fill(); }
    if (h > 8) { g.fillStyle = 'rgba(170,70,70,.7)'; g.beginPath(); g.ellipse(cx, y + h * .85, w * .22, h * .2, 0, 0, Math.PI * 2); g.fill(); }
    g.drawImage(jaw, 0, h);
  }
  // Злость: лёгкий румянец
  if (anger > 30) { g.fillStyle = `rgba(220,40,20,${(anger - 30) / 70 * .18})`; g.fillRect(0, 0, W, 520); }
}
let mouthOpen = 0;
function loop(now) {
  const dt = Math.min(100, now - (loop.p || now)); loop.p = now;
  if (!front.complete || !back.complete) return requestAnimationFrame(loop);
  if (!jaw) prep();
  if (now > nextBlink) { blinkT = 150; nextBlink = now + 2000 + Math.random() * 3500; }
  if (blinkT > 0) blinkT -= dt;
  anger = Math.max(0, anger - dt * .006);
  $('fill').style.width = anger + '%';
  if (turned && now > turnUntil) { turned = false; say(pick(['Ладно, прощаю.', 'Всё, я снова тут.', 'Ну что, мир?'])); }
  // Открытие рта: от громкости записи или от синтеза речи
  let target = 0;
  if (src) target = Math.max(0, level() - .08) * 1.4;
  else if (ttsOn || now < ttsUntil) target = (Math.sin(now / 55) * .5 + .5) * (Math.sin(now / 170) * .35 + .65);
  mouthOpen += (Math.min(1, target) - mouthOpen) * (target > mouthOpen ? .55 : .3);
  // Поворот: сжимаем по горизонтали и меняем кадр на середине
  flip += ((turned ? 1 : 0) - flip) * Math.min(1, dt / 120);
  const sx = Math.abs(Math.cos(flip * Math.PI));
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#16202e'; g.fillRect(0, 0, W, H);
  g.setTransform(Math.max(.02, sx), 0, 0, 1, W / 2 * (1 - Math.max(.02, sx)), 0);
  if (flip > .5) g.drawImage(back, 0, 0); else drawFace(now, mouthOpen);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // Покачивание головы во время речи
  const talking = mouthOpen > .05;
  stage.style.transform = talking ? `rotate(${Math.sin(now / 400) * .8}deg) translateY(${Math.sin(now / 260) * 1.5}px)` : anger > 60 ? `translateX(${Math.sin(now / 30) * 2}px)` : '';
  if (started && !turned && !talking && now > nextIdle && now - lastTalk > 20000) { nextIdle = now + 40000 + Math.random() * 40000; playRandom(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Подгонка размера
const fit = $('fit');
function resize() {
  const s = Math.min(fit.clientWidth / W, fit.clientHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
new ResizeObserver(resize).observe(fit); addEventListener('resize', resize); resize();
})();
</script>
</body>
</html>
